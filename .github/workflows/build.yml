name: Build yupic

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - target: aarch64-apple-darwin
            name: macOS-arm64
            vcpkg-triplet: arm64-osx
            rust-targets: aarch64-apple-darwin
          - target: x86_64-apple-darwin
            name: macOS-x64
            vcpkg-triplet: x64-osx
            rust-targets: x86_64-apple-darwin
          - target: universal-apple-darwin
            name: macOS-universal
            vcpkg-triplet: universal
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin

    runs-on: macos-latest
    env:
      PKG_CONFIG_ALLOW_CROSS: 1
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.rust-targets }}

      - name: Install build dependencies (macOS)
        run: brew install autoconf automake libtool pkg-config nasm create-dmg

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: vcpkg
          key: ${{ runner.os }}-vcpkg-${{ matrix.settings.vcpkg-triplet }}-${{ hashFiles('.github/workflows/build.yml') }}

      - name: Install vcpkg and libheif
        run: |
          if [ ! -d "vcpkg" ]; then
            git clone https://github.com/microsoft/vcpkg.git
            ./vcpkg/bootstrap-vcpkg.sh
          fi
          
          VCPKG_ROOT=$(pwd)/vcpkg
          echo "VCPKG_ROOT=$VCPKG_ROOT" >> $GITHUB_ENV
          
          # Force static linkage for dependencies
          echo "VCPKG_LIBRARY_LINKAGE=static" >> $GITHUB_ENV

          if [ "${{ matrix.settings.vcpkg-triplet }}" == "universal" ]; then
            $VCPKG_ROOT/vcpkg install libheif:arm64-osx libheif:x64-osx
            # Universal 빌드 시 아키텍처별 pkg-config 경로 설정
            echo "PKG_CONFIG_PATH_aarch64_apple_darwin=$VCPKG_ROOT/installed/arm64-osx/lib/pkgconfig" >> $GITHUB_ENV
            echo "PKG_CONFIG_PATH_x86_64_apple_darwin=$VCPKG_ROOT/installed/x64-osx/lib/pkgconfig" >> $GITHUB_ENV
          else
            $VCPKG_ROOT/vcpkg install libheif:${{ matrix.settings.vcpkg-triplet }}
            echo "PKG_CONFIG_PATH=$VCPKG_ROOT/installed/${{ matrix.settings.vcpkg-triplet }}/lib/pkgconfig" >> $GITHUB_ENV
          fi

      - name: Install frontend dependencies
        run: npm install

      - name: Detect app version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [[ "${GITHUB_REF_NAME}" == v* ]]; then
            APP_VERSION="${GITHUB_REF_NAME#v}"
          else
            APP_VERSION=$(node -e "const tauri=require('./src-tauri/tauri.conf.json'); const pkg=require('./package.json'); const ver=(tauri?.package?.version)||pkg.version||'0.0.0'; console.log(ver);")
          fi
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.settings.target }}

      - name: Ad-hoc sign the app bundle and Re-package DMG
        run: |
          echo "Performing ad-hoc signing for ${{ matrix.settings.target }}"
          base_dir="src-tauri/target/${{ matrix.settings.target }}/release/bundle"
          app_path="$base_dir/macos/yupic.app"
          dmg_dir="$base_dir/dmg"
          
          if [ -d "$app_path" ]; then
            # 1. Sign the binaries and app bundle
            echo "Signing binaries..."
            find "$app_path" -name "*.dylib" -or -name "*.so" | xargs codesign --force --deep --sign -
            codesign --force --deep --sign - "$app_path"
            echo "Signing complete."

            # 2. Re-create DMG with the signed app
            if [ -d "$dmg_dir" ]; then
                echo "Removing unsigned DMGs generated by Tauri..."
                rm -f "$dmg_dir"/*.dmg
            else
                mkdir -p "$dmg_dir"
            fi

            arch_label="${{ matrix.settings.target }}"
            arch_label="${arch_label%-apple-darwin}"
            dmg_name="yupic_${APP_VERSION}_${arch_label}.dmg"
            out_dmg="$dmg_dir/$dmg_name"

            staging_dir=$(mktemp -d)
            mkdir -p "$staging_dir/app"
            cp -R "$app_path" "$staging_dir/app/"

            echo "Creating pretty DMG: $out_dmg"
            create-dmg \
              --volname "yupic" \
              --window-pos 200 120 \
              --window-size 600 400 \
              --icon-size 128 \
              --icon "yupic.app" 150 190 \
              --hide-extension "yupic.app" \
              --app-drop-link 450 190 \
              "$out_dmg" \
              "$staging_dir/app/"

            rm -rf "$staging_dir"
            echo "DMG creation complete."
          else
            echo "App bundle not found at $app_path"
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yupic-${{ matrix.settings.name }}
          path: src-tauri/target/${{ matrix.settings.target }}/release/bundle/dmg/
          if-no-files-found: ignore

  build-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            name: Windows-x64
            vcpkg_triplet: x64-windows
          - target: i686-pc-windows-msvc
            name: Windows-x86
            vcpkg_triplet: x86-windows
          - target: aarch64-pc-windows-msvc
            name: Windows-arm64
            vcpkg_triplet: arm64-windows

    runs-on: windows-latest
    env:
      VCPKG_DEFAULT_TRIPLET: ${{ matrix.vcpkg_triplet }}-static
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install vcpkg and libheif
        shell: pwsh
        run: |
          if (-not (Test-Path -Path 'vcpkg')) {
            git clone https://github.com/microsoft/vcpkg vcpkg
            .\vcpkg\bootstrap-vcpkg.bat
          }

          $vcpkgRoot = (Resolve-Path "vcpkg").Path
          echo "VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV

          $triplet = '${{ matrix.vcpkg_triplet }}'
          $static = "$triplet-static"

          Write-Host "Installing libheif for $static"
          .\vcpkg\vcpkg install libheif --triplet $static
          .\vcpkg\vcpkg integrate install

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yupic-${{ matrix.name }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/
          if-no-files-found: ignore

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.msi
            artifacts/**/nsis/**
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}