name: Build yupic

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - target: aarch64-apple-darwin
            name: macOS-arm64
            vcpkg-triplet: arm64-osx
            rust-targets: aarch64-apple-darwin
          - target: x86_64-apple-darwin
            name: macOS-x64
            vcpkg-triplet: x64-osx
            rust-targets: x86_64-apple-darwin
          - target: universal-apple-darwin
            name: macOS-universal
            vcpkg-triplet: universal
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin

    runs-on: macos-latest
    env:
      PKG_CONFIG_ALLOW_CROSS: 1
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.rust-targets }}

      - name: Install build dependencies (macOS)
        run: brew install autoconf automake libtool pkg-config nasm

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: vcpkg
          key: ${{ runner.os }}-vcpkg-${{ matrix.settings.vcpkg-triplet }}-${{ hashFiles('.github/workflows/build.yml') }}

      - name: Install vcpkg and libheif
        run: |
          if [ ! -d "vcpkg" ]; then
            git clone https://github.com/microsoft/vcpkg.git
            ./vcpkg/bootstrap-vcpkg.sh
          fi
          
          VCPKG_ROOT=$(pwd)/vcpkg
          echo "VCPKG_ROOT=$VCPKG_ROOT" >> $GITHUB_ENV

          # Force static linkage for dependencies to avoid missing dylib errors
          echo "VCPKG_LIBRARY_LINKAGE=static" >> $GITHUB_ENV
          
          if [ "${{ matrix.settings.vcpkg-triplet }}" == "universal" ]; then
            $VCPKG_ROOT/vcpkg install libheif:arm64-osx libheif:x64-osx
            # Universal 빌드 시 아키텍처별 pkg-config 경로 설정
            echo "PKG_CONFIG_PATH_aarch64_apple_darwin=$VCPKG_ROOT/installed/arm64-osx/lib/pkgconfig" >> $GITHUB_ENV
            echo "PKG_CONFIG_PATH_x86_64_apple_darwin=$VCPKG_ROOT/installed/x64-osx/lib/pkgconfig" >> $GITHUB_ENV
          else
            $VCPKG_ROOT/vcpkg install libheif:${{ matrix.settings.vcpkg-triplet }}
            echo "PKG_CONFIG_PATH=$VCPKG_ROOT/installed/${{ matrix.settings.vcpkg-triplet }}/lib/pkgconfig" >> $GITHUB_ENV
          fi

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.settings.target }}

      - name: Ad-hoc sign the app bundle
        run: |
          echo "Performing ad-hoc signing for ${{ matrix.settings.target }}"
          app_path="src-tauri/target/${{ matrix.settings.target }}/release/bundle/macos/yupic.app"
          if [ -d "$app_path" ]; then
            find "$app_path" -name "*.dylib" -or -name "*.so" | xargs codesign --force --deep --sign -
            codesign --force --deep --sign - "$app_path"
          else
            echo "App bundle not found at $app_path"
          fi

      - name: List build bundles
        run: |
          echo "Listing bundles for target: ${{ matrix.settings.target }}"
          ls -la src-tauri/target/${{ matrix.settings.target }}/release/bundle || true

      - name: Verify DMG(s) and generate checksums
        if: always()
        run: |
          set -euo pipefail
          dmgdir=src-tauri/target/${{ matrix.settings.target }}/release/bundle/dmg
          if [ -d "$dmgdir" ]; then
            for f in "$dmgdir"/*.dmg; do
              if [ -f "$f" ]; then
                echo "Verifying $f"
                hdiutil verify "$f"
                echo "Generating sha512 for $f"
                shasum -a 512 "$f" > "$f.sha512"
                ls -lh "$f" "$f.sha512"
              fi
            done
          else
            echo "No dmg directory at $dmgdir"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yupic-${{ matrix.settings.name }}
          path: |
            src-tauri/target/${{ matrix.settings.target }}/release/bundle/dmg/
            src-tauri/target/${{ matrix.settings.target }}/release/bundle/dmg/*.sha512
          if-no-files-found: ignore

  build-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            name: Windows-x64
            vcpkg-triplet: x64-windows
          - target: i686-pc-windows-msvc
            name: Windows-x86
            vcpkg-triplet: x86-windows
          - target: aarch64-pc-windows-msvc
            name: Windows-arm64
            vcpkg-triplet: arm64-windows

    runs-on: windows-latest
    env:
      VCPKG_ROOT: C:\vcpkg
      VCPKG_DEFAULT_TRIPLET: ${{ matrix.vcpkg-triplet }}-static-md
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install vcpkg and libheif
        shell: pwsh
        run: |
          if (-not (Test-Path -Path 'C:\vcpkg')) {
            git clone https://github.com/microsoft/vcpkg C:\vcpkg
            C:\vcpkg\bootstrap-vcpkg.bat
          }

          $env:VCPKG_ROOT = 'C:\vcpkg'
          $triplet = '${{ matrix.vcpkg-triplet }}'
          $static = "$triplet-static-md"

          Write-Host "Installing libheif for $static"
          C:\vcpkg\vcpkg install libheif --triplet $static
          C:\vcpkg\vcpkg integrate install

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VCPKG_ROOT: C:\vcpkg
        with:
          args: --target ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yupic-${{ matrix.name }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/
          if-no-files-found: ignore

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.msi
            artifacts/**/nsis/**
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
